name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NPCAP_SDK_VERSION: "1.13"

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check Zabbix templates are up to date
        run: |
          python3 zabbix/gen_template.py
          git diff --exit-code zabbix/

  windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The pcap crate links against wpcap.lib / Packet.lib from the Npcap SDK.
      # Only the import libraries are needed to build; the Npcap runtime is
      # installed on the machine that runs the exe.
      - name: Download Npcap SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\npcap-sdk.zip"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIBPCAP_LIBDIR=$env:RUNNER_TEMP\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: cargo build --release --locked

      # Tests are not run here: the test binary needs wpcap.dll at load time,
      # and the Npcap runtime cannot be installed silently on CI runners.
      - name: Package
        shell: pwsh
        run: |
          $out = "stp-monitor-windows-x64"
          New-Item -ItemType Directory -Path "$out\zabbix" | Out-Null
          Copy-Item target\release\stp-monitor.exe, stp-monitor.example.toml, README.md $out
          Copy-Item zabbix\*.yaml "$out\zabbix"
          Compress-Archive -Path "$out\*" -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: stp-monitor-windows-x64
          path: stp-monitor-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stp-monitor-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: stp-monitor-windows-x64.zip
          generate_release_notes: true
